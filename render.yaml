services:
  - type: web
    name: driftless-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: driftless-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: redis, name: driftless-redis, property: connectionString}
  - type: worker
    name: driftless-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: rq worker stripe twilio default --url $REDIS_URL
    numInstances: 2
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: driftless-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: redis, name: driftless-redis, property: connectionString}
  - type: redis
    name: driftless-redis
    plan: starter
    ipAllowList: []
databases:
  - name: driftless-db
    plan: basic-1gb
